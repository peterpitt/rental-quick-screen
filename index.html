<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>租屋快篩</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>租屋快篩</h1>
    <p class="tagline">把一長串物件，快速篩成一份短名單。</p>
  </header>

  <main class="app-main">
    <form class="filters" id="filters" aria-label="快篩條件">
      <label class="filter">
        <span>最高租金：<output id="rent-output">不限</output></span>
        <input type="range" id="f-rent" min="5000" max="60000" step="1000" value="60000" />
      </label>
      <label class="filter">
        <span>最少房數</span>
        <select id="f-rooms">
          <option value="0">不限</option>
          <option value="1">1 房以上</option>
          <option value="2">2 房以上</option>
          <option value="3">3 房以上</option>
        </select>
      </label>
      <label class="filter">
        <span>行政區</span>
        <select id="f-district">
          <option value="">不限</option>
        </select>
      </label>
      <fieldset class="musthave">
        <legend>必備條件（缺一即淘汰）</legend>
        <label><input type="checkbox" id="m-pets" /> 可養寵物</label>
        <label><input type="checkbox" id="m-elevator" /> 有電梯</label>
        <label><input type="checkbox" id="m-mrt" /> 近捷運</label>
      </fieldset>
      <button type="button" id="f-reset" class="reset-btn">重設</button>
    </form>
    <div class="toolbar">
      <span id="summary" class="summary"></span>
      <label class="sort">
        排序：
        <select id="f-sort">
          <option value="score">綜合評分</option>
          <option value="rent">租金低到高</option>
          <option value="size">坪數大到小</option>
          <option value="commute">離捷運近</option>
        </select>
      </label>
    </div>
    <div class="shortlist-bar" id="shortlist-bar">
      <span id="shortlist-count">候選名單：0 筆</span>
      <button type="button" id="compare-btn" class="ghost-btn" disabled>比較候選</button>
      <button type="button" id="clear-shortlist" class="ghost-btn" disabled>清除候選</button>
    </div>

    <section id="compare" class="compare" hidden aria-label="候選比較">
      <!-- 比較表由 app.js 動態產生 -->
    </section>

    <section id="results" class="results" aria-live="polite">
      <!-- 物件卡片由 app.js 動態產生 -->
    </section>
  </main>

  <footer class="app-footer">
    <small>租屋快篩 · 本機示範資料</small>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
